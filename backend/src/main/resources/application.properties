# application
spring.application.name=obratech
server.port=9999
app.frontend-url=${APP_FRONTEND_URL:}
app.mail.from=${APP_MAIL_FROM:no-reply@obratech.local}
spring.devtools.livereload.enabled=false

# Codificación
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true
spring.mandatory-file-encoding=UTF-8

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/obratech
spring.data.mongodb.database=obratech

# Correo para recuperación de contraseña
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}


# Sesión y cookies
server.servlet.session.cookie.name=OBRATECH_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.max-age=86400
server.servlet.session.timeout=2h

# Archivos
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB

# Datos de prueba
app.seed.enabled=false

# Errores
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always

# Desarrollo
spring.jmx.enabled=false
spring.application.admin.enabled=false
spring.devtools.restart.enabled=false

# OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
